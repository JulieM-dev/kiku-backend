services:
  postgres:
    image: postgres:16
    container_name: kiku-postgres
    restart: always
    environment:
      POSTGRES_DB: kiku
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kiku-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  voicevox:
    image: voicevox/voicevox_nemo_engine:cpu-ubuntu20.04-latest
    container_name: kiku-voicevox
    restart: always
    ports:
      - "50121:50121"
    tty: true
    networks:
      - kiku-network


  app:
    image: kiku-backend:latest
    container_name: kiku-app
    restart: always
    depends_on:
      - postgres
      - voicevox
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_JWT_EXPIRATION: 86400000
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kiku
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_VOICEVOX_BASE_URL: http://voicevox:50121
      APP_TTS_CACHE_DIR: /tmp/kiku/audio-cache
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    networks:
      - kiku-network

networks:
  kiku-network:
    driver: bridge

volumes:
  postgres_data: