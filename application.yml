spring:
  application:
    name: kiku

  main:
    web-application-type: servlet

  datasource:
    url: jdbc:postgresql://localhost:5432/kiku
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  docker:
    compose:
      lifecycle-management: start-and-stop

server:
  port: 8080

app:
  tts:
    engine: voicevox
    cache-dir: /tmp/kiku/audio-cache
  voicevox:
    base-url: http://localhost:50121